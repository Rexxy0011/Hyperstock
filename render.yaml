# Render Blueprint — HyperStocks
# https://docs.render.com/infrastructure-as-code
#
# Deploy both services from a single monorepo.
# Set environment variables in the Render dashboard (never in this file).

services:
  # ── Server (Web Service) ──────────────────────────────────────────────
  - type: web
    name: hyperstocks-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      # Set these in the Render dashboard — never commit secrets.
      - key: MONGODB_URI
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: API_ORIGIN
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ── Client (Static Site) ──────────────────────────────────────────────
  - type: web
    name: hyperstocks-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA: serve index.html for all routes so React Router handles them.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
